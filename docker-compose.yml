services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixya_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - fixya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixya_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fixya_db
      SECRET_KEY: ${SECRET_KEY:-fixya_secreto}
      RUN_SEED: ${RUN_SEED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.4-mini}
      # IA de reseñas. Orden: Groq -> Gemini -> análisis local (sin clave).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      # Polling para que uvicorn --reload detecte cambios en Windows+Docker
      WATCHFILES_FORCE_POLLING: "true"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      # Código montado en vivo: no hay que reconstruir la imagen ante cada cambio
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      # Polling para que Vite detecte cambios de archivos en Windows+Docker
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      # Código montado en vivo; node_modules queda en el volumen de la imagen
      - ./frontend:/app
      - /app/node_modules

volumes:
  fixya_postgres_data:
